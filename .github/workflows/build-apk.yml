name: APK olustur

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Paketleri kur
        run: |
          npm install
          npx expo install expo-router expo-sqlite expo-secure-store expo-status-bar expo-constants expo-linking expo-notifications expo-clipboard expo-location expo-task-manager react react-native react-native-screens react-native-safe-area-context
          npm install --save-dev typescript @types/react

      - name: Android projesini olustur
        run: npx expo prebuild --platform android --no-install

      - name: APK derle
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: APK dosyasini sakla
        uses: actions/upload-artifact@v4
        with:
          name: kronos-aura-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Indirilebilir surum olustur
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-${{ github.run_number }}" \
            android/app/build/outputs/apk/release/*.apk \
            --title "Kronos ve Aura APK ${{ github.run_number }}" \
            --notes "Android telefonda indirip ac. Bilinmeyen kaynaklardan yuklemeye izin vermen istenebilir."
